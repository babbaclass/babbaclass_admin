name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: astute-window-472313-g9
  REGION: asia-northeast3
  SERVICE_NAME: babba-api
  REPO_NAME: babba-registry
  IMAGE_NAME: babba-api
  REGISTRY: asia-northeast3-docker.pkg.dev
  CLOUD_SQL_INSTANCE: astute-window-472313-g9:asia-northeast3:babba-db

jobs:
  migrate:
    name: Alembic upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate with Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1024083500192/locations/global/workloadIdentityPools/github-pool/providers/github-actions-provider
          service_account: github-actions@astute-window-472313-g9.iam.gserviceaccount.com

      - name: Start Cloud SQL Auth Proxy
        run: |
          PROXY_VERSION="v2.11.3"
          curl -L -o cloud-sql-proxy "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/${PROXY_VERSION}/cloud-sql-proxy.linux.amd64"
          chmod +x cloud-sql-proxy
          # GitHub-hosted runner uses public IP path through Auth Proxy
          nohup ./cloud-sql-proxy "${{ env.CLOUD_SQL_INSTANCE }}" \
            --address 127.0.0.1 \
            --port 3306 \
            > cloud-sql-proxy.log 2>&1 &
          echo $! > cloud-sql-proxy.pid
          for i in $(seq 1 30); do
            if python3 -c "import socket; s=socket.create_connection(('127.0.0.1',3306),2); s.close()" 2>/dev/null; then
              echo "✓ Cloud SQL Proxy is listening on 127.0.0.1:3306"
              exit 0
            fi
            echo "  Waiting for Cloud SQL Proxy... ($i/30)"
            sleep 2
          done
          echo "❌ Cloud SQL Proxy failed to start"
          cat cloud-sql-proxy.log || true
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify DB via Cloud SQL Proxy
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          python3 <<'PY' || { echo "---- cloud-sql-proxy.log ----"; cat cloud-sql-proxy.log || true; exit 1; }
          import os, sys
          import pymysql
          try:
              conn = pymysql.connect(
                  host=os.environ["DB_HOST"],
                  port=int(os.environ["DB_PORT"]),
                  user=os.environ["DB_USER"],
                  password=os.environ["DB_PASSWORD"],
                  database=os.environ["DB_NAME"],
                  connect_timeout=20,
                  read_timeout=20,
                  write_timeout=20,
              )
              with conn.cursor() as cur:
                  cur.execute("SELECT 1")
                  print("✓ DB connection OK:", cur.fetchone())
              conn.close()
          except Exception as exc:
              print("❌ DB connection failed:", type(exc).__name__, exc)
              sys.exit(1)
          PY

      - name: Show Alembic status
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          CLOUD_SQL_HOST: 127.0.0.1
          # Avoid unix-socket probe from app.database during model import
          CLOUD_SQL_INSTANCE: ""
          DB_SSL_MODE: DISABLED
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          alembic current || true
          alembic heads

      - name: Run Alembic upgrade
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          CLOUD_SQL_HOST: 127.0.0.1
          CLOUD_SQL_INSTANCE: ""
          DB_SSL_MODE: DISABLED
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          alembic upgrade head || {
            echo "---- cloud-sql-proxy.log ----"
            cat cloud-sql-proxy.log || true
            exit 1
          }

  deploy:
    name: Deploy to Cloud Run
    needs: migrate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate with Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1024083500192/locations/global/workloadIdentityPools/github-pool/providers/github-actions-provider
          service_account: github-actions@astute-window-472313-g9.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:latest \
            -f Dockerfile \
            .

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy service to Cloud Run (clear legacy VPC connector)
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --platform=managed \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --service-account=github-actions@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --clear-vpc-connector \
            --vpc-egress=private-ranges-only \
            --clear-cloudsql-instances \
            --memory=512Mi \
            --cpu=1 \
            --timeout=300 \
            --no-traffic \
            --set-env-vars CLOUD_SQL_INSTANCE="",CLOUD_SQL_HOST="10.85.224.3",DB_USER="${{ secrets.DB_USER }}",DB_PASSWORD="${{ secrets.DB_PASSWORD }}",DB_NAME="${{ secrets.DB_NAME }}",MAKESHOP_API_TIMEOUT=60,MAKESHOP_CLIENT_ID="${{ secrets.MAKESHOP_CLIENT_ID }}",MAKESHOP_CLIENT_SECRET="${{ secrets.MAKESHOP_CLIENT_SECRET }}",MAKESHOP_SHOP_UID="${{ secrets.MAKESHOP_SHOP_UID }}",MAKESHOP_USE_REST=true,GOOGLE_CHAT_WEBHOOK_URL="https://chat.googleapis.com/v1/spaces/AAQAU3lYF4Y/messages?key=AIzaSyDdI0hCZtE6vySjMm-WEfRq3CPzqKqqsHI&token=O2xA-6Nk9fhha_lYou1PbmpQudVCFNo_drL49w6wT1o",MAKESHOP_REST_CHAT_NOTIFY=true,MAKESHOP_DUAL_COMPARE=false,RUN_MIGRATIONS=false

      - name: Deploy service to Cloud Run (direct VPC egress)
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --platform=managed \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --allow-unauthenticated \
            --service-account=github-actions@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --network=default \
            --subnet=default \
            --vpc-egress=all-traffic \
            --clear-cloudsql-instances \
            --memory=512Mi \
            --cpu=1 \
            --timeout=300 \
            --no-traffic \
            --set-env-vars CLOUD_SQL_INSTANCE="",CLOUD_SQL_HOST="10.85.224.3",DB_USER="${{ secrets.DB_USER }}",DB_PASSWORD="${{ secrets.DB_PASSWORD }}",DB_NAME="${{ secrets.DB_NAME }}",MAKESHOP_API_TIMEOUT=60,MAKESHOP_CLIENT_ID="${{ secrets.MAKESHOP_CLIENT_ID }}",MAKESHOP_CLIENT_SECRET="${{ secrets.MAKESHOP_CLIENT_SECRET }}",MAKESHOP_SHOP_UID="${{ secrets.MAKESHOP_SHOP_UID }}",MAKESHOP_USE_REST=true,GOOGLE_CHAT_WEBHOOK_URL="https://chat.googleapis.com/v1/spaces/AAQAU3lYF4Y/messages?key=AIzaSyDdI0hCZtE6vySjMm-WEfRq3CPzqKqqsHI&token=O2xA-6Nk9fhha_lYou1PbmpQudVCFNo_drL49w6wT1o",MAKESHOP_REST_CHAT_NOTIFY=true,MAKESHOP_DUAL_COMPARE=false,RUN_MIGRATIONS=false

      - name: Route traffic to new revision
        run: |
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --to-revisions LATEST=100 \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}

      - name: Sync Cloud Scheduler jobs
        run: |
          chmod +x setup-cloud-scheduler.sh
          ./setup-cloud-scheduler.sh

      - name: Verify Scheduler and Cloud Tasks wiring
        run: |
          chmod +x scripts/verify-scheduler-cloud-tasks.sh
          ./scripts/verify-scheduler-cloud-tasks.sh

      - name: Deployment summary
        run: |
          echo "✓ Deployment completed!"
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          echo "Service URL: $SERVICE_URL"
          echo "Image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
