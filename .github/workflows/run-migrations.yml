name: Run Alembic Migrations

on:
  workflow_dispatch:
    inputs:
      target_revision:
        description: "Alembic target revision (default: head)"
        required: false
        default: "head"

env:
  CLOUD_SQL_INSTANCE: astute-window-472313-g9:asia-northeast3:babba-db

jobs:
  migrate:
    name: Alembic upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Authenticate with Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1024083500192/locations/global/workloadIdentityPools/github-pool/providers/github-actions-provider
          service_account: github-actions@astute-window-472313-g9.iam.gserviceaccount.com

      - name: Start Cloud SQL Auth Proxy
        run: |
          PROXY_VERSION="v2.11.3"
          curl -L -o cloud-sql-proxy "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/${PROXY_VERSION}/cloud-sql-proxy.linux.amd64"
          chmod +x cloud-sql-proxy
          nohup ./cloud-sql-proxy "${{ env.CLOUD_SQL_INSTANCE }}" --port 3306 > cloud-sql-proxy.log 2>&1 &
          for i in $(seq 1 30); do
            if python3 -c "import socket; s=socket.create_connection(('127.0.0.1',3306),2); s.close()" 2>/dev/null; then
              echo "✓ Cloud SQL Proxy is ready on 127.0.0.1:3306"
              exit 0
            fi
            echo "  Waiting for Cloud SQL Proxy... ($i/30)"
            sleep 2
          done
          echo "❌ Cloud SQL Proxy failed to start"
          cat cloud-sql-proxy.log || true
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show Alembic info
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          CLOUD_SQL_HOST: 127.0.0.1
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          alembic current || true
          alembic history -n 10 || true

      - name: Run Alembic upgrade
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          CLOUD_SQL_HOST: 127.0.0.1
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          revision="${{ github.event.inputs.target_revision }}"
          if [ -z "$revision" ]; then revision="head"; fi
          echo "Upgrading to revision: $revision"
          alembic upgrade "$revision"

      - name: Show Alembic head
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          CLOUD_SQL_HOST: 127.0.0.1
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          PYTHONPATH: ${{ github.workspace }}
        run: alembic heads
