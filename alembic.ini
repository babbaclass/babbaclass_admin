# Alembic Configuration File

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
#file_template = %%(rev)s_%%(rev)s_%%(create_date)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field
# set to 0 to disable
truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# set to 'true' to run env.py when invoking revision
# with 'autogenerate' in command line.
# autogenerate_version_location =

# When set to 'true', a revision script will be generated
# automatically when you run "alembic revision" with the
# --autogenerate flag.  Set to 'false' to disable this.
#
# Note that the environment.py file MUST configure the
# SQLAlchemy engine or connection string contents,
# otherwise an exception occurs when attempting to invoke
# the revision command.  In a typical Flask-SQLAlchemy
# model.py-based setup, this would be:
#
#    engine = create_engine(
#        os.getenv('SQLALCHEMY_DATABASE_URL') or 'sqlite:///model.db'
#    )
#
# For Pyramid, set your SQLAlchemy.url setting to use the value of the
# environment variable SQLALCHEMY_DATABASE_URL and use model.py-based
# reflection to populate the Alembic migrations table, see the Towards
# Alembic docs at http://alembic.readthedocs.org/en/latest/branches.html#working-with-branches
#
# sqlalchemy.url = driver://user:password@localhost/dbname

sqlalchemy.url = 

# Logging configuration
# Invoke logging.config.fileConfig() to setup logging
# when running scripts.
#
# Examples:
# config_file_name = logging.config
# fileConfig(config_file_name)

# set to 'true' to run the environment script
# 'env.py' before the revision scripts
# includes the message in the 'Skel' objects
# that may be passed into configure_logging()
#
# revision_environment = false

# Logging configuration
loggers:
  qualname: alembic
  level: INFO
  handlers:
    console:

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
