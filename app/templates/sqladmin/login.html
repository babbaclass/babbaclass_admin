<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Login - babba-api</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        font-family: -apple-system, BlinkMacSystemFont, San Francisco, Segoe UI, Roboto, sans-serif;
      }
      .login-container {
        background: white;
        padding: 3rem;
        border-radius: 8px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 400px;
      }
      .login-header {
        text-align: center;
        margin-bottom: 2rem;
      }
      .login-header h1 {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: #333;
      }
      .login-header p {
        color: #666;
        font-size: 0.9rem;
      }
      .form-group {
        margin-bottom: 1.5rem;
      }
      .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        color: #333;
        font-size: 0.95rem;
      }
      .form-group input {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 1rem;
        transition: border-color 0.3s;
      }
      .form-group input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }
      .form-group input::placeholder {
        color: #999;
      }
      .password-wrapper {
        position: relative;
      }
      .password-wrapper input {
        padding-right: 4rem;
      }
      .password-toggle {
        position: absolute;
        top: 50%;
        right: 0.5rem;
        transform: translateY(-50%);
        border: none;
        background: none;
        color: #667eea;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        padding: 0.25rem 0.5rem;
      }
      .password-toggle:focus-visible {
        outline: 2px solid #667eea;
        border-radius: 4px;
      }
      .login-button {
        width: 100%;
        padding: 0.75rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
        transition: opacity 0.3s;
      }
      .login-button:hover {
        opacity: 0.9;
      }
      .login-button:active {
        transform: scale(0.98);
      }
      .alert {
        margin-bottom: 1.5rem;
        padding: 0.75rem;
        border-radius: 4px;
        font-size: 0.9rem;
      }
      .alert-danger {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <h1>바빠 스마트 클래스 정산 서비스</h1>
      </div>

      {% if error %}
      <div class="alert alert-danger">
        {{ error }}
      </div>
      {% endif %}

      <form method="post">
        <div class="form-group">
          <label for="username">로그인 아이디</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="로그인 아이디를 입력하세요"
            required
            autofocus
          />
        </div>

        <div class="form-group">
          <label for="password">비밀번호</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="비밀번호를 입력하세요"
              required
            />
            <button
              type="button"
              class="password-toggle"
              id="toggle-password-visibility"
              aria-pressed="false"
              aria-label="비밀번호 표시"
            >
              <span class="password-toggle-text">표시</span>
            </button>
          </div>
        </div>

        <button type="submit" class="login-button">로그인</button>
      </form>
    </div>

    <script>
      // 로그인 페이지에 진입할 때 admin_loaded 플래그 제거
      // (로그아웃 후 재로그인 시 정산 개요를 다시 처음 화면으로 로드하기 위함)
      localStorage.removeItem('admin_loaded');
      console.log('[Login Page] admin_loaded flag cleared');

      const passwordInput = document.getElementById('password');
      const passwordToggle = document.getElementById('toggle-password-visibility');
      const toggleText = passwordToggle?.querySelector('.password-toggle-text');

      const setToggleState = (isVisible) => {
        if (!passwordToggle || !toggleText) {
          return;
        }
        passwordToggle.setAttribute('aria-pressed', String(isVisible));
        passwordToggle.setAttribute('aria-label', isVisible ? '비밀번호 숨기기' : '비밀번호 표시');
        toggleText.textContent = isVisible ? '숨김' : '표시';
      };

      if (passwordInput && passwordToggle) {
        passwordToggle.addEventListener('click', () => {
          const isCurrentlyHidden = passwordInput.type === 'password';
          passwordInput.type = isCurrentlyHidden ? 'text' : 'password';
          setToggleState(isCurrentlyHidden);
        });
      }
    </script>
  </body>
</html>
